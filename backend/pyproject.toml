[project]
name = "clientops-agent-backend"
version = "0.1.0"
description = "clientops-agent backend scaffold"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.117",
  "uvicorn>=0.30,<0.35",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg2-binary>=2.9,<3",
  "httpx>=0.27,<0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]
