name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: pytest backend/tests -q

  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f AGENTS.md && test -f docker-compose.yml && test -f docs/architecture.md
